<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Clipboard com Grupos</title>
  <style>
    :root {
      --primary: #3b82f6;
      --danger: #ef4444;
      --bg: #f5f7fb;
      --card-bg: #fff;
      --text: #111827;
      --muted: #6b7280;
      --radius: 10px;
      --shadow: 0 3px 8px rgba(0,0,0,.08);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 30px;
      color: var(--text);
    }

    h2 {
      margin-bottom: 16px;
      font-weight: 600;
    }

    .form {
      background: var(--card-bg);
      box-shadow: var(--shadow);
      padding: 20px;
      border-radius: var(--radius);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 30px;
    }

    input {
      flex: 1 1 180px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: var(--radius);
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      padding: 10px 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all .15s ease;
    }

    button svg {
      width: 17px;
      height: 17px;
    }

    .add-btn {
      background: var(--primary);
      color: #fff;
    }

    .add-btn:hover {
      background: #2563eb;
    }

    .group {
      background: var(--card-bg);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      margin-bottom: 25px;
      overflow: hidden;
    }

    .group h3 {
      margin: 0;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background: #f3f4f6;
      font-size: 18px;
      border-bottom: 1px solid #e5e7eb;
    }

    .group-content {
      padding: 10px 16px;
      transition: all .2s ease;
    }

    .hidden {
      display: none !important;
    }

    .item {
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item:not(:last-child) {
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 10px;
      padding-bottom: 24px;
    }

    .info {
      flex: 1;
    }

    .title {
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .value {
      color: var(--muted);
      font-size: 14px;
      word-break: break-word;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .copy-btn {
      background: var(--primary);
      color: #fff;
    }

    .copy-btn:hover {
      background: #2563eb;
    }

    .delete-btn {
      background: var(--danger);
      color: #fff;
    }

    .delete-btn:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <h2>📋 Meu Clipboard</h2>
  <div class="form">
    <input id="group" placeholder="Grupo (ex: Gmail)">
    <input id="name" placeholder="Nome (ex: Email)">
    <input id="value" placeholder="Valor (ex: teste@gmail.com)">
    <button class="add-btn" onclick="addClipboard()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      Adicionar
    </button>
  </div>

  <div id="groupsContainer"></div>

  <script>
    let clipboards = JSON.parse(localStorage.getItem('clipboards') || '[]');
    const container = document.getElementById('groupsContainer');

    function save() {
      localStorage.setItem('clipboards', JSON.stringify(clipboards));
    }

    function render() {
      container.innerHTML = '';
      const grouped = clipboards.reduce((acc, item) => {
        acc[item.group] = acc[item.group] || [];
        acc[item.group].push(item);
        return acc;
      }, {});

      Object.keys(grouped).forEach(group => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'group';

        const header = document.createElement('h3');
        header.innerHTML = `
          ${group}
          <svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor' style='width:18px;height:18px;'>
            <path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7' />
          </svg>
        `;
        header.onclick = () => toggleGroup(content);

        const content = document.createElement('div');
        content.className = 'group-content';

        grouped[group].forEach(item => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
            <div class="info">
              <div class="title">${item.name}</div>
              <div class="value">${item.value}</div>
            </div>
            <div class="actions">
              <button class="copy-btn" onclick="copyText('${item.value.replace(/'/g, "\\'")}', this)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16h8M8 12h8m-8-4h8m2 10H6a2 2 0 01-2-2V6a2 2 0 012-2h8l4 4v10a2 2 0 01-2 2z"/>
                </svg>
                Copiar
              </button>
              <button class="delete-btn" onclick="deleteClipboard('${group}', '${item.name}')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </button>
            </div>
          `;
          content.appendChild(div);
        });

        groupDiv.appendChild(header);
        groupDiv.appendChild(content);
        container.appendChild(groupDiv);
      });
    }

    async function copyText(text, btn) {
      let ok = false;
      try {
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(text);
          ok = true;
        }
      } catch(e) {
        ok = false;
      }
    
      if(!ok){
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          ok = true;
        } catch(e) {
          ok = false;
        }
      }
    
      if(ok){
        const original = btn.innerHTML;
        btn.innerHTML = 'Copiado';
        btn.disabled = true;
        setTimeout(() => {
          btn.innerHTML = original;
          btn.disabled = false;
        }, 1500);
      } else {
        alert('Não foi possível copiar. Copie manualmente.');
      }
    }

    function addClipboard() {
      const group = document.getElementById('group').value.trim();
      const name = document.getElementById('name').value.trim();
      const value = document.getElementById('value').value.trim();

      if (!group || !name || !value) return alert('Preencha todos os campos.');
      clipboards.push({ group, name, value });
      save();
      render();
      document.getElementById('group').value = '';
      document.getElementById('name').value = '';
      document.getElementById('value').value = '';
    }

    function deleteClipboard(group, name) {
      clipboards = clipboards.filter(item => !(item.group === group && item.name === name));
      save();
      render();
    }

    function toggleGroup(content) {
      content.classList.toggle('hidden');
    }

    render();
  </script>
</body>
</html>
